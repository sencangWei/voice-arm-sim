<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌面语音抓取实验室</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;color:#e8eeed;background:#101617;--muted:#9aabaa;--line:#334043}*{box-sizing:border-box}body{margin:0}main{max-width:1450px;margin:auto;padding:28px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}header{margin-bottom:22px}h1{font-size:25px;margin:0}h2{font-size:16px;margin:0 0 14px}.muted,small{color:var(--muted);font-size:13px}.badge{padding:6px 13px;border:1px solid var(--line);border-radius:25px;font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}.panel{background:#1a2224;border:1px solid var(--line);border-radius:14px;overflow:hidden}.bar{padding:12px 17px;font-size:13px;border-bottom:1px solid var(--line)}.feed{aspect-ratio:4/3;position:relative;display:grid;place-items:center;background:#11191b;color:var(--muted);font-size:13px}.feed img{position:absolute;width:100%;height:100%;object-fit:contain}.content{padding:20px}form{display:flex;gap:9px;flex-wrap:wrap}input{flex:1;min-width:180px;background:#101819;border:1px solid #445456;color:inherit;padding:12px;border-radius:8px;font:inherit}input:focus{outline:2px solid #9ce0bd}button,select{border:1px solid #445456;background:#293638;color:inherit;font:inherit;border-radius:8px;padding:9px 13px;cursor:pointer}button:hover:not(:disabled){background:#3c4d49}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#9ce0bd;color:#14291f;font-weight:650}.danger{border-color:#9c6262;color:#ffb6b6}.recording{background:#754747}.quick,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{font-size:13px}.tools{padding-top:17px;margin-top:17px;border-top:1px solid var(--line)}#feedback{min-height:27px;margin:12px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}#feedback.error{color:#ffb6b6}.kv{display:grid;grid-template-columns:62px 1fr;gap:8px 12px;font-size:13px}.kv label{color:var(--muted)}.kv span{overflow-wrap:anywhere}#events{max-height:135px;overflow:auto;margin-top:15px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted)}footer{color:var(--muted);font-size:12px}select{padding:3px 8px;font-size:12px}@media(max-width:850px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:21px}header{align-items:flex-start}.feed{max-height:420px}}
</style>
<main>
<header><div><h1>桌面语音抓取实验室</h1><small>说出目标，观察机械臂在仿真中完成抓取。</small></div><span class="badge"><span id="connection">正在连接</span> · 仅仿真</span></header>
<section class="grid" aria-label="仿真画面"><div class="panel"><div class="bar"><span>场景视角</span><small>实时画面</small></div><div class="feed">等待仿真画面…<img id="scene" alt="仿真桌面场景" hidden></div></div><div class="panel"><div class="bar"><span>辅助视角</span><select id="view" aria-label="选择辅助视角"><option value="top">俯视桌面</option><option value="wrist">腕部视角</option></select></div><div class="feed">等待仿真画面…<img id="detail" alt="辅助仿真视角" hidden></div></div></section>
<section class="grid"><div class="panel content"><div class="bar"><h2>发出指令</h2><select id="mode" aria-label="视觉定位模式"><option value="auto">自动选择视觉来源</option><option value="color">颜色 RGB-D 基线</option><option value="vlm">Qwen VLM + RGB-D</option></select></div><form id="commandForm"><input id="text" autocomplete="off" maxlength="300" placeholder="例如：把红色方块放进蓝色托盘" aria-label="抓取指令"><button id="send" class="primary">执行指令</button><button id="mic" type="button">开始录音</button></form><div class="quick"><button data-command="把红色方块放进蓝色托盘">红色方块 → 蓝色托盘</button><button data-command="把苹果放进蓝色托盘">苹果 → 蓝色托盘</button><button data-command="把香蕉放进蓝色托盘">香蕉 → 蓝色托盘</button></div><p id="feedback" role="status" aria-live="polite">点击录音开始，再点击一次结束并执行。</p><div class="tools"><button id="reset">随机布局</button><button id="pause">暂停</button><button id="stop" class="danger">立即停止</button></div><p class="muted">第一版支持桌面范围内的抓取与放置。未知目标或含糊指令需要进一步澄清。</p></div><div class="panel content"><h2>执行状态</h2><div class="kv"><label>阶段</label><span id="phase">等待连接</span><label>进度</label><span id="message">—</span><label>步数</label><span id="steps">—</span><label>耗时</label><span id="elapsed">—</span><label>结果</label><span id="result">尚无执行结果</span><label>语音</label><span id="asr">等待状态</span><label>视觉</label><span id="vision">等待状态</span><label>本次定位</label><span id="source">等待指令</span></div><div id="events"></div></div></section>
<footer>录音需要麦克风权限，结束后发送到本机识别并自动执行。VLM 未就绪时使用颜色与 RGB-D 基线，仅支持已知桌面物品，不具备通用识别能力。</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let state={},online=false,pending=false,starting=false,recording=false,uploading=false,guardUntil=0,startTime=0;
let context,stream,source,processor,silent,chunks=[],samples=0,rate=0;
const phaseNames={idle:'就绪',ready:'就绪',loading:'加载中',listening:'录音中',transcribing:'识别语音',parsing:'理解指令',planning:'规划动作',executing:'执行中',running:'执行中',paused:'已暂停',done:'已完成',success:'已完成',failed:'执行失败',error:'出现错误',stopped:'已停止',clarify:'等待澄清',clarification:'等待澄清'};
function feedback(text,error=false){$('feedback').textContent=text;$('feedback').classList.toggle('error',error)}
function locked(){return pending||starting||recording||uploading||!!state.busy||Date.now()<guardUntil}
function controls(){const busy=locked();$('mode').disabled=busy||!online;$('send').disabled=busy||!online;$('text').disabled=busy;document.querySelectorAll('[data-command]').forEach(b=>b.disabled=busy||!online);$('reset').disabled=busy||!online;$('pause').disabled=pending||starting||recording||uploading||!online;$('pause').textContent=state.phase==='paused'?'继续':'暂停';$('stop').disabled=!online;$('mic').disabled=starting||uploading||pending||(!recording&&(!!state.busy||!online||Date.now()<guardUntil));$('mic').textContent=recording?'结束录音并执行':starting?'请求麦克风…':uploading?'识别中…':'开始录音';$('mic').classList.toggle('recording',recording)}
async function api(path,body,raw=false){const res=await fetch(path,{method:'POST',headers:{'Content-Type':raw?'audio/wav':'application/json',...(raw?{'X-Vision-Mode':$('mode').value}:{})},body:raw?body:JSON.stringify(body)});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.detail||data.message||`请求失败（${res.status}）`);return data}
async function action(path,body){if(pending)return;pending=true;controls();try{const data=await api(path,body);if(data.message)feedback(data.message);return data}catch(e){feedback('网络或服务错误：'+e.message,true)}finally{pending=false;controls();poll()}}
async function command(text){text=text.trim();if(!text||locked()||!online)return;$('text').value=text;startTime=Date.now();feedback('指令已发送，正在处理…');const data=await action('/api/command',{text,mode:$('mode').value});if(data)guardUntil=Date.now()+700;controls()}
$('commandForm').onsubmit=e=>{e.preventDefault();command($('text').value)};document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));$('reset').onclick=()=>{if(!locked()){startTime=0;$('elapsed').textContent='—';action('/api/reset',{seed:Math.floor(Math.random()*2147483647),mode:$('mode').value})}};$('pause').onclick=()=>action('/api/pause',{});
$('stop').onclick=async()=>{if(recording)await finishRecording(false);try{const data=await api('/api/stop',{});feedback(data.message||'已发送停止请求。')}catch(e){feedback('停止请求失败：'+e.message,true)}poll()};
function display(value,fallback='—'){if(value===null||value===undefined)return fallback;if(typeof value==='object')return value.message||value.status||value.name||JSON.stringify(value);return String(value)}
function render(){const phase=state.phase||'idle';if(state.mode&&!pending)$('mode').value=state.mode;$('source').textContent=state.detection_source||'等待指令';$('phase').textContent=phaseNames[phase]||phase;$('message').textContent=display(state.message);$('steps').textContent=display(state.steps);$('result').textContent=display(state.last_result,'尚无执行结果');$('asr').textContent=display(state.models?.asr,'未就绪');$('vision').textContent=display(state.models?.vision,'未就绪，使用颜色 RGB-D 基线');const result=state.last_result;if(state.busy&&startTime)$('elapsed').textContent=((Date.now()-startTime)/1000).toFixed(1)+' 秒';else if(result&&typeof result==='object'){const sec=result.elapsed_s??result.elapsed_seconds??result.duration_s;if(sec!==undefined)$('elapsed').textContent=Number(sec).toFixed(1)+' 秒'}$('events').replaceChildren();(state.events||[]).slice(-6).reverse().forEach(event=>{const row=document.createElement('div');row.textContent=typeof event==='string'?event:display(event.message??event.text??event);$('events').append(row)});controls()}
let polling=false;async function poll(){if(polling)return;polling=true;try{const res=await fetch('/api/state',{cache:'no-store'});if(!res.ok)throw new Error();state=await res.json();online=true;$('connection').textContent='已连接';render()}catch{online=false;$('connection').textContent='连接中断';controls()}finally{polling=false}}
function frame(id,view){const img=$(id);function update(){img.onload=()=>{img.hidden=false;setTimeout(update,150)};img.onerror=()=>{img.hidden=true;setTimeout(update,1000)};img.src='/api/frame?view='+view()+'&t='+Date.now()}update()}frame('scene',()=> 'scene');frame('detail',()=> $('view').value);
function wav(){const data=new ArrayBuffer(44+samples*2),v=new DataView(data);const label=(offset,text)=>{for(let i=0;i<text.length;i++)v.setUint8(offset+i,text.charCodeAt(i))};label(0,'RIFF');v.setUint32(4,36+samples*2,true);label(8,'WAVE');label(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);label(36,'data');v.setUint32(40,samples*2,true);let offset=44;for(const chunk of chunks)for(const value of chunk){const s=Math.max(-1,Math.min(1,value));v.setInt16(offset,s<0?s*32768:s*32767,true);offset+=2}return new Blob([data],{type:'audio/wav'})}
async function cleanup(){if(processor){processor.onaudioprocess=null;processor.disconnect()}if(source)source.disconnect();if(silent)silent.disconnect();if(stream)stream.getTracks().forEach(t=>t.stop());if(context&&context.state!=='closed')await context.close();processor=source=silent=stream=context=null}
async function beginRecording(){if(locked()||!online)return;if(!navigator.mediaDevices?.getUserMedia){feedback('无法访问麦克风。请使用 localhost 或安全连接，并检查麦克风设备。',true);return}starting=true;controls();try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)throw new Error('浏览器不支持录音');context=new AudioCtor();await context.resume();rate=context.sampleRate;chunks=[];samples=0;source=context.createMediaStreamSource(stream);processor=context.createScriptProcessor(4096,1,1);silent=context.createGain();silent.gain.value=0;processor.onaudioprocess=e=>{if(!recording)return;const copy=new Float32Array(e.inputBuffer.getChannelData(0));chunks.push(copy);samples+=copy.length;if(samples>=rate*30)finishRecording(true)};source.connect(processor);processor.connect(silent);silent.connect(context.destination);recording=true;feedback('正在录音…说完后点击“结束录音并执行”（最长 30 秒）。')}catch(e){await cleanup();feedback('麦克风不可用：'+(e.name==='NotAllowedError'?'未获得录音权限，请在浏览器中允许麦克风。':e.message),true)}finally{starting=false;controls()}}
async function finishRecording(submit=true){if(!recording)return;recording=false;uploading=submit;controls();const audio=submit?wav():null;await cleanup();try{if(!submit){feedback('录音已取消。');return}if(samples<rate*.25){feedback('录音太短，请重新录制。',true);return}feedback('正在识别语音，识别后自动执行…');const data=await api('/api/audio',audio,true);if(data.text){$('text').value=data.text;feedback('识别结果：'+data.text);startTime=Date.now();guardUntil=Date.now()+700}else feedback(data.message||'没有识别出有效语音，请重新录制。',true)}catch(e){feedback('语音识别失败：'+e.message,true)}finally{uploading=false;chunks=[];samples=0;controls();poll()}}
$('mode').onchange=()=>action('/api/mode',{mode:$('mode').value});$('mic').onclick=()=>recording?finishRecording(true):beginRecording();window.addEventListener('pagehide',()=>{recording=false;cleanup()});poll();setInterval(poll,500);setInterval(controls,250);
</script>
</html>
